name: CodeQL

on:
  push:
    branches-ignore:
      - "dependabot/**"
  pull_request:
  public:
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
cache-mode: none

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: python
            build-mode: none
    uses: Flow-Steward/extensions/.github/workflows/codeql-scan.yml@codeql-stable
    with:
      language: ${{ matrix.language }}
      build-mode: ${{ matrix.build-mode }}
