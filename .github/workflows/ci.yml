# Every push and pull request runs the extension's tests and builds the archive
# the catalog would publish. The Release workflow runs this same workflow.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  extension:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Reproduce maintained AWS wheels from official sources
        run: |
          python - <<'PYCODE'
          import hashlib
          import json
          import subprocess
          import sys
          import tempfile
          import urllib.request
          from pathlib import Path

          rows = json.loads(Path("dependency-sources.json").read_text())["dependencies"]
          with tempfile.TemporaryDirectory() as directory:
              source = Path(directory) / "source"
              output = Path(directory) / "output"
              source.mkdir()
              for row in rows:
                  data = urllib.request.urlopen(row["upstream_url"], timeout=60).read()
                  assert hashlib.sha256(data).hexdigest() == row["upstream_sha256"]
                  (source / row["upstream_url"].rsplit("/", 1)[-1]).write_bytes(data)
              subprocess.run([sys.executable, "scripts/rebuild_aws_wheels.py", str(source), str(output)], check=True)
              for row in rows:
                  assert (output / row["wheel_filename"]).read_bytes() == (Path("wheels") / row["wheel_filename"]).read_bytes()
          PYCODE
      - name: Test dependencies
        # The host provides flowsteward-extension-sdk at runtime; tests use the
        # wheel committed in dev-wheels/ until the SDK is published.
        run: |
          pip install pytest==9.2.0 PyYAML==6.0.4
          if ls dev-wheels/flowsteward_extension_sdk-*.whl >/dev/null 2>&1; then pip install dev-wheels/flowsteward_extension_sdk-*.whl; fi
          # The extension's own runtime dependencies (python_requirements):
          # written by new_extension_repo.py, kept by the author.
          if [ -f .github/requirements-test.txt ]; then pip install --no-index --find-links wheels -r .github/requirements-test.txt; fi
      - name: Repository workflow contracts
        run: python -m pytest -q -p no:cacheprovider .github/tests
      - name: Extension tests
        run: |
          if [ -d tests ]; then python -m pytest -q -p no:cacheprovider tests; else echo "no tests/"; fi
      - name: Package the archive
        run: |
          python .github/scripts/package_extension.py
          # Recorded before any fetched code runs; the release verifies it again.
          (cd dist && sha256sum -- *.zip > SHA256SUMS)
      - name: The catalog would accept it
        run: python .github/scripts/catalog_check.py dist/*.zip
      - name: The archives are still the ones packaged
        run: cd dist && sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: |
            dist/*.zip
            dist/SHA256SUMS
          if-no-files-found: error
