page_id: dropbox-setup
title: Dropbox setup
description: Configure this project's Dropbox app; connect accounts on the Dropbox tab.
project_scoped: true
components:
  - component_id: dropbox_setup_guide
    type: markdown
    title: Dropbox setup guide
    body: |
      **Create the Dropbox app**

      In the Dropbox App Console, create an app with **Scoped access**. Choose **Full Dropbox** to work with files that already exist in the account; **App folder** limits every path to the app's own folder. The access type decides which files the app can reach; it does not change the permissions below.

      On the **Permissions** tab, enable exactly `files.metadata.read`, `files.content.read` and `files.content.write`, then submit. Flow Steward asks for these three scopes and no others: no account details, sharing or team access.

      On the **Settings** tab, add the exact Flow Steward callback URI shown on this extension's setup form as a redirect URI. Copy the App key and App secret into this project's Dropbox setup form. The secret stays in Flow Steward's encrypted OAuth store; it is never part of the extension package.

      **Connect an account**

      Open the **Dropbox** tab and use **Dropbox accounts**. Dropbox asks the account owner to approve the app; Flow Steward keeps the long-lived refresh token and gives each workflow step only a short-lived access token for the account that step selected.

      **What the connection does**

      List Files, Download File and Upload File work with paths relative to the connected account's root. Listing reads at most 500 entries of one folder and never searches the whole account. Upload creates a file only in a folder that already exists, and replaces an existing file only when Overwrite is on.

      [Dropbox OAuth guide](https://developers.dropbox.com/oauth-guide)

      [Dropbox App Console](https://www.dropbox.com/developers/apps)
  - component_id: dropbox_app_credentials_help
    anchor_id: app-credentials
    type: markdown
    title: App credentials
    content: Check that the App key and App secret come from the same Dropbox app and that the exact callback URI is listed as a redirect URI.
  - component_id: dropbox_authorize_again_help
    anchor_id: authorize-again
    type: markdown
    title: Authorize again
    content: The account's authorization expired or was revoked. Connect the account again and approve the app.
  - component_id: dropbox_app_permissions_help
    anchor_id: app-permissions
    type: markdown
    title: App permissions
    content: Enable files.metadata.read, files.content.read and files.content.write on the app's Permissions tab, submit, then connect the account again so the new scopes are granted.
