connection_types:
  - connection_type_id: ftp
    display_name: FTP / FTPS
    description: Project-scoped FTP or explicit FTPS account rooted at a server-side jailed directory.
    config_schema:
      type: object
      additionalProperties: false
      required: [host]
      properties:
        host:
          type: string
          minLength: 1
          title: Host
        port:
          type: integer
          minimum: 1
          maximum: 65535
          default: 21
          title: Port
        root_path:
          type: string
          default: "."
          title: Root path
        use_tls:
          type: boolean
          default: true
          title: Use explicit FTPS
        allow_insecure_ftp:
          type: boolean
          default: false
          title: Acknowledge plaintext FTP
        connect_timeout_seconds:
          type: number
          minimum: 1
          maximum: 60
          default: 15
          title: Connect timeout
        read_timeout_seconds:
          type: number
          minimum: 1
          maximum: 300
          default: 30
          title: Read timeout
    secret_schema:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          title: Username
        password:
          type: string
          minLength: 1
          title: Password
    capabilities:
      test_connection: true
      list_files: true
      fetch_file: true
      upload_file: true
    safety_profile:
      protocol: ftp
      requires_pinned_peer: true
      plaintext_requires_acknowledgement: true
      requires_server_side_jail: true
  - connection_type_id: sftp
    display_name: SFTP
    description: Project-scoped SFTP account with pinned OpenSSH SHA-256 host-key fingerprint.
    config_schema:
      type: object
      additionalProperties: false
      required: [host, host_key_fingerprint]
      properties:
        host:
          type: string
          minLength: 1
          title: Host
        port:
          type: integer
          minimum: 1
          maximum: 65535
          default: 22
          title: Port
        root_path:
          type: string
          default: "."
          title: Root path
        host_key_fingerprint:
          type: string
          pattern: "^SHA256:[A-Za-z0-9+/]+$"
          title: Host key fingerprint
        connect_timeout_seconds:
          type: number
          minimum: 1
          maximum: 60
          default: 15
          title: Connect timeout
        read_timeout_seconds:
          type: number
          minimum: 1
          maximum: 300
          default: 30
          title: Read timeout
    secret_schema:
      type: object
      additionalProperties: false
      required: [username]
      oneOf:
        - required: [password]
          not:
            anyOf:
              - required: [private_key]
              - required: [private_key_passphrase]
        - required: [private_key]
          not:
            required: [password]
      properties:
        username:
          type: string
          minLength: 1
          title: Username
        password:
          type: string
          title: Password
        private_key:
          type: string
          title: Private key
        private_key_passphrase:
          type: string
          title: Private key passphrase
    capabilities:
      test_connection: true
      list_files: true
      fetch_file: true
      upload_file: true
    safety_profile:
      protocol: sftp
      requires_pinned_peer: true
      requires_host_key_fingerprint: true
      disables_agent_and_local_key_discovery: true
  - connection_type_id: s3
    display_name: S3-compatible storage
    description: One bucket and key prefix on AWS S3 or an S3-compatible service, reached with explicit access keys.
    config_schema:
      type: object
      additionalProperties: false
      required: [endpoint_url, region, bucket]
      properties:
        endpoint_url:
          type: string
          minLength: 9
          pattern: "^https://[^/?#@]+/?$"
          title: Endpoint URL
          description: HTTPS origin of the service, for example https://s3.eu-central-1.amazonaws.com.
        region:
          type: string
          pattern: "^[a-z0-9][a-z0-9-]{0,62}$"
          title: Region
        bucket:
          type: string
          minLength: 3
          maxLength: 63
          title: Bucket
        root_prefix:
          type: string
          default: ""
          title: Key prefix
          description: Folder-like prefix every path is relative to, without a trailing slash. Empty is the bucket root.
        addressing_style:
          type: string
          enum: [path, virtual]
          default: path
          title: Addressing style
        connect_timeout_seconds:
          type: number
          minimum: 1
          maximum: 60
          default: 15
          title: Connect timeout
        read_timeout_seconds:
          type: number
          minimum: 1
          maximum: 300
          default: 30
          title: Read timeout
    secret_schema:
      type: object
      additionalProperties: false
      required: [access_key_id, secret_access_key]
      properties:
        access_key_id:
          type: string
          minLength: 1
          title: Access key ID
        secret_access_key:
          type: string
          minLength: 1
          title: Secret access key
        session_token:
          type: string
          title: Session token
    capabilities:
      test_connection: true
      list_files: true
      fetch_file: true
      upload_file: true
    safety_profile:
      protocol: https
      requires_pinned_peer: true
      explicit_credentials_only: true
      conditional_create: true
  - connection_type_id: dropbox
    display_name: Dropbox
    description: One Dropbox account authorized in this project to list, read and write files below its root folder.
    auth:
      type: oauth2
      provider_id: dropbox_oauth
      scopes:
        required: [files.metadata.read, files.content.read, files.content.write]
        optional: []
    config_schema:
      type: object
      additionalProperties: false
      properties:
        root_path:
          type: string
          default: "."
          title: Root folder
          description: Folder inside the Dropbox app's access that every path is relative to. "." is the top.
    secret_schema:
      type: object
      additionalProperties: false
      properties:
        access_token:
          type: string
    capabilities:
      test_connection: true
      list_files: true
      fetch_file: true
      upload_file: true
    safety_profile:
      protocol: https
      fixed_origins: [https://api.dropboxapi.com, https://content.dropboxapi.com]
      requires_pinned_peer: true
