forms:
  - operation_id: list_files
    title: List remote files
    fields:
      - name: path
        widget_type: text
        label: Directory
        help_text: Directory relative to the connection root. Use "." for the root itself.
        required: true
      - name: name_glob
        widget_type: text
        label: Filename glob
        help_text: "Optional filename pattern such as *.csv. With a download, path becomes the directory in which to match files."
        placeholder: "*.csv"
      - name: limit
        widget_type: number
        label: Limit
        help_text: "Maximum number of results to return in this page."
  - operation_id: fetch_file
    title: "Download remote file"
    fields:
      - name: path
        widget_type: text
        label: Path or directory
        help_text: >-
          Without a filename glob this is the file to fetch. With a glob it is the
          directory to search; use "." for the connection root.
        required: true
      - name: name_glob
        widget_type: text
        label: Filename glob
        help_text: >-
          Optional. When set, Path is treated as a directory and the glob selects
          the file inside it.
        placeholder: "*.csv"
      - name: select
        widget_type: select
        label: Selection
        options:
          - label: Only match
            value: only
          - label: Latest modified
            value: latest_modified
          - label: Latest name
            value: latest_name
        help_text: "Choose only to require one match, latest_modified for the newest modification time, or latest_name for the last filename in sort order."
      - name: max_bytes
        widget_type: number
        label: Max bytes
        help_text: "Maximum allowed file size in bytes. Leave empty to use the host's configured artifact limit; oversized files fail."
  - operation_id: upload_file
    title: "Upload file to remote storage"
    fields:
      - name: artifact_handle
        widget_type: artifact_picker
        label: Artifact
        required: true
        help_text: "Map the file artifact handle returned by an earlier download or file-generation step. The file must be available to this workflow run."
      - name: remote_path
        widget_type: text
        label: Remote path
        required: true
        help_text: "Destination filename and any directory relative to the configured connection root."
        placeholder: "reports/daily.pdf"
      - name: overwrite
        widget_type: boolean
        label: Overwrite
        help_text: "Enable to replace a file already at the destination. Leave disabled to reject an existing file."
      - name: max_bytes
        widget_type: number
        label: Max bytes
        help_text: "Maximum allowed file size in bytes. Leave empty to use the host's configured artifact limit; oversized files fail."
