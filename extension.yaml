manifest_version: 2
lifecycle:
  data_schema_version: 1
  data_migrations: []
extension_id: flowsteward.file-transfer
kind: tool_provider
version: 0.3.4
display_name: File Transfer
description: |-
  File Transfer connects Flow Steward workflows to FTP, explicit FTPS, SFTP, S3-compatible object storage and Dropbox. List files in a directory, download a selected file for the next workflow step, or upload a file produced earlier in the run. Select downloads by exact name or filename pattern, with options to choose by filename or modification time. Transfer results include file size and checksum information.

  Collect supplier feeds, retrieve invoice PDFs for document extraction, bring exported spreadsheets into tabular processing or publish generated reports to a partner's storage. The same three workflow operations work across the supported storage connections, letting you reuse a familiar approach as destinations change. Files are passed between steps as workflow artifacts; parsing and conversion can be added through other steps.

  Configure each project connection with its remote root and credentials. FTP, FTPS, SFTP and S3 endpoints must be publicly reachable over the Internet; private-network destinations are not supported in production. SFTP setup includes confirming the server fingerprint; Dropbox uses your own app and account authorization. Listings cover one directory with up to 500 entries, and transfers default to a 200 MiB ceiling. Uploads preserve existing files unless you explicitly choose to replace them.
vendor:
  name: Flow Steward
  support_url: https://github.com/Flow-Steward/ext-file-transfer-sftp/issues
  website_url: https://github.com/Flow-Steward/ext-file-transfer-sftp
listing:
  category: data
  tags:
  - file-transfer
  - ftp
  - ftps
  - sftp
  - s3
  - dropbox
  summary: |-
    List, download and upload workflow files through FTP, FTPS, SFTP, S3-compatible storage and Dropbox.
  setup_summary: |-
    Create a project connection to a publicly reachable Internet FTP/FTPS, SFTP or S3 endpoint, with its root and credentials; verify the SFTP fingerprint with the server owner. For Dropbox, configure a scoped app with file metadata/read/write permissions, register the displayed redirect URI, then authorize the account.
features:
- tool
- action
supported_url_schemes:
- ftp
- ftps
- sftp
- https
required_scopes:
- extension:invoke
- artifact:read
machine_auth:
  service_account_key: svc_ext_file_transfer
  required_scopes:
  - extension:invoke
  - artifact:read
schemas:
  config: schemas/config.schema.yaml
  secrets: schemas/secrets.schema.yaml
  subscriptions: schemas/subscriptions.schema.yaml
  input:
    type: object
    properties:
      action:
        type: string
      request:
        type: object
    required:
    - action
  output:
    type: object
    properties:
      ok:
        type: boolean
      result:
        type: object
      error_code:
        type: string
    required:
    - ok
account_scope:
  scope_type: project
  description: File connections are project-scoped; passwords and keys stay in encrypted
    connection secrets, and Dropbox tokens stay with Core's OAuth store.
egress:
  hosts:
  - api.dropboxapi.com
  - content.dropboxapi.com
  connection_fields:
  - ftp.host
  - sftp.host
  - s3.endpoint_url
external_effects:
- operation_id: upload_file
  effect_kind: file_delivery
  channel: file_transfer
  idempotency: required
  test_mode_behavior: suppress
runtime:
  contract_version: extension_host_v2
  extension_contract_v2:
    oauth_providers:
    - provider_id: dropbox_oauth
      display_name: Dropbox
      description: A project-owned Dropbox app and the Dropbox accounts authorized
        through it.
      setup_page_id: dropbox
      help_page_id: dropbox
      error_help_anchors:
        invalid_client: app-credentials
        authorization_required: authorize-again
        authorization_denied: authorize-again
      flow:
        type: authorization_code
        pkce: s256
      credential_fields:
      - field_id: client_id
        value_type: text
        required: true
        secret: false
        browser_exposable: true
        change_policy: reauthorization_required
        label: Dropbox App key
        help_text: Enter the App key from the Dropbox App Console.
        autocomplete: username
        validation:
          min_length: 1
          max_length: 512
      - field_id: client_secret
        value_type: secret
        required: true
        secret: true
        change_policy: runtime_revalidate
        label: Dropbox App secret
        help_text: Enter the matching App secret from the Dropbox App Console.
        autocomplete: current-password
        validation:
          min_length: 1
          max_length: 4096
      authorization_endpoint:
        url: https://www.dropbox.com/oauth2/authorize
      token_endpoint:
        url: https://api.dropboxapi.com/oauth2/token
        client_auth_method: client_secret_post
      callback_id: oauth_authorization
      authorization_intents:
      - intent_id: dropbox_connect
        static_parameters:
          token_access_type: offline
    connection_types: contracts/connection_types.yaml
    operation_manifest: contracts/operation_manifest.yaml
    artifact_policies: contracts/artifact_policies.yaml
    step_ui_manifest: contracts/step_ui_manifest.yaml
artifact_policies:
- operation_id: fetch_file
  outputs:
  - kind: artifact
    binding_key: fetched_file
    filename: download.bin
    content_type: application/octet-stream
    max_size_bytes: 209715200
    max_size_env: FS_EXTENSION_ARTIFACT_MAX_BYTES
    retention_class: run_window
- operation_id: upload_file
  inputs:
  - kind: artifact
    value_type: artifact_handle
    binding_key: source_artifact
    field: artifact_handle
    required: true
    max_size_bytes: 209715200
    max_size_env: FS_EXTENSION_ARTIFACT_MAX_BYTES
entrypoint:
  mode: subprocess
  command:
  - python3
  - main.py
  timeout_policy:
    env: FS_EXTENSION_OPERATION_TIMEOUT_SECONDS
    default_seconds: 300
    minimum_seconds: 30
    maximum_seconds: 3600
    headroom_seconds: 30
health:
  command:
  - python3
  - health.py
  timeout_seconds: 5
ui_manifest: ui/ui_manifest.yaml
callbacks:
- callback_id: oauth_authorization
  purpose: oauth_authorization
  methods:
  - GET
  connection_scoped: false
action_manifest: ui/actions/actions.yaml
