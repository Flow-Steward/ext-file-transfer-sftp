[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [
  ".fs-python",
  "dev-wheels",
  "wheels",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "PIE", "RET", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true
explicit_package_bases = true
exclude = "(^\\.fs-python/|^dev-wheels/|^wheels/)"

[tool.bandit]
exclude_dirs = [
  ".fs-python",
  "dev-wheels",
  "tests",
  "wheels",
]
